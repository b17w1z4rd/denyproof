[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "denyproof"
version = "0.1.0"
description = "Controlled authorization testing with denial-body leak checks and redacted evidence"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
denyproof = "denyproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
